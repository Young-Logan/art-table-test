<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;overflow:hidden}
  .shell{display:flex;flex-direction:column;height:100vh}
  .header{background:#1a2744;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .header h1{font-size:15px;font-weight:600;letter-spacing:.3px;margin:0}
  .tabs{display:flex;background:#1a2744;border-top:1px solid #2d3a5c;flex-shrink:0}
  .tab{padding:7px 16px;color:#8a9cc5;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;user-select:none}
  .tab.active{color:#fff;border-bottom-color:#5b9bd5}
  #map{width:100%;height:300px;flex-shrink:0;z-index:0}
  .filters{display:flex;flex-wrap:wrap;background:#fff;border-bottom:1px solid #dde3ee;flex-shrink:0}
  .f-wrap{position:relative;border-right:1px solid #dde3ee}
  .f-btn{background:#fff;border:none;padding:8px 12px;font-size:12px;color:#333;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .f-btn.on{background:#eef3fb;color:#1a2744;font-weight:600}
  .plus{color:#1a2744;font-weight:700;font-size:13px}
  .dd{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #dde3ee;border-radius:4px;z-index:1000;min-width:180px;box-shadow:0 3px 12px rgba(0,0,0,.12);max-height:220px;overflow-y:auto}
  .dd.open{display:block}
  .dd input{width:100%;padding:6px 10px;border:none;border-bottom:1px solid #eee;font-size:12px;outline:none}
  .opt{padding:6px 12px;font-size:12px;cursor:pointer;color:#333}
  .opt:hover,.opt.sel{background:#eef3fb;color:#1a2744}
  .rbar{background:#f0f4fa;padding:4px 12px;font-size:11.5px;color:#1a2744;font-weight:500;border-bottom:1px solid #dde3ee;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .clr{font-size:11px;color:#5b9bd5;cursor:pointer;background:none;border:none;padding:2px 6px}
  .tbl-wrap{overflow-y:auto;flex:1}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{background:#f7f9fc;color:#1a2744;font-weight:500;padding:7px 8px;text-align:left;border-bottom:2px solid #dde3ee;position:sticky;top:0;z-index:5;white-space:nowrap;font-size:11.5px}
  thead th:nth-child(1){width:58px}
  thead th:nth-child(2){width:160px}
  thead th:nth-child(3){width:130px}
  thead th:nth-child(4){width:140px}
  thead th:nth-child(5){width:110px}
  thead th:nth-child(6){width:100px}
  thead th:nth-child(7){width:120px}
  thead th:nth-child(8){width:auto}
  tbody tr{border-bottom:.5px solid #eee;cursor:pointer}
  tbody tr:hover{background:#f0f6ff}
  tbody tr.hl{background:#d4e4f7!important}
  td{padding:6px 8px;vertical-align:middle;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  td.wrap{white-space:normal}
  td a{color:#2563a8;text-decoration:none;font-size:11px}
  td a:hover{text-decoration:underline}
  .ic{width:58px;padding:4px 6px}
  .ib{width:48px;height:36px;border-radius:3px;overflow:hidden;background:#e8eef8;position:relative;display:block;flex-shrink:0}
  .ib img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s;position:absolute;inset:0}
  .ib img.loaded{opacity:1}
  .ib .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7.5px;color:#aaa;text-align:center;padding:2px;line-height:1.2;pointer-events:none}
  .badge{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10.5px;white-space:nowrap}
  .bb{background:#e8eef8;color:#1a2744}
  .ba{background:#f3e8f8;color:#5a1a7a}
  .pop-img{width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:5px;display:block}
  .sbar{background:#fff8e1;border-bottom:1px solid #ffe082;padding:4px 12px;font-size:11px;color:#795548;display:none;flex-shrink:0}
  .sbar.on{display:block}
  /* fix Webflow global img max-width bleeding into tiles */
  #map img{max-width:none!important;max-height:none!important;box-shadow:none!important}
</style>

  {img:"",artist:"Rashad Ali Muhammad",title:"I Am Not Your Target",medium:"Vinyl Wrap",lat:38.94651,lng:-76.94593,addr:"Rte 1 / Charles Armentrout",year:"2018"},
  {img:"",artist:"Sofia Gawer-Fische",title:"The Sky's The Limit",medium:"Sculpture",lat:38.96499,lng:-76.93867,addr:"6309 Baltimore Ave",year:"2002"},
  {img:"",artist:"Phillip Ratner",title:"Images of America",medium:"Sculpture",lat:38.97017,lng:-76.95507,addr:"Toledo Rd",year:"2003"},
  {img:"",artist:"Art Landerman",title:"Jiffy Plumbing Mural",medium:"Mural",lat:38.94655,lng:-76.94085,addr:"4623 Baltimore Ave",year:"2016"},

];

// =============================================================================
// STATE
// =============================================================================
var map, bizLayer, artLayer, bizMarkers=[], artMarkers=[], hlRow=-1;
var curTab='biz';
var filt={name:'',area:'',type:'',svc:'',artist:'',medium:''};
var BIZD=[], ARTD=[], filtBiz=[], filtArt=[];
var obs;

function dom(u){try{return new URL(u).hostname.replace('www.','').substring(0,28);}catch(e){return '';}}
function uniq(a){return Array.from(new Set(a.filter(Boolean))).sort();}
function ss(id,msg){var el=document.getElementById(id);if(el)el.textContent=msg;}
function sbar(msg,show){var el=document.getElementById('sbar');el.textContent=msg;el.classList.toggle('on',show);}

// =============================================================================
// DATA LOAD
// =============================================================================
var configured = CFG.BIZ_URL.indexOf('YOUR_SHEET_ID')===-1;

function loadData(){
  if(!configured){useFallback();return;}
  sbar('Fetching live data from Google Sheets…',true);
  var bd=null,ad=null,be=false,ae=false;
  function check(){
    if(bd===null||ad===null)return;
    if(be||ae){useFallback();return;}
    BIZD=bd.slice(2).map(parseBiz).filter(Boolean);
    ARTD=ad.slice(2).map(parseArt).filter(Boolean);
    sbar('',false);
    ss('src-label','Live • '+BIZD.length+' businesses');
    finish();
  }
  Papa.parse(CFG.BIZ_URL,{download:true,header:false,skipEmptyLines:true,
    complete:function(r){bd=r.data;check();},error:function(){be=true;bd=[];check();}});
  Papa.parse(CFG.ART_URL,{download:true,header:false,skipEmptyLines:true,
    complete:function(r){ad=r.data;check();},error:function(){ae=true;ad=[];check();}});
  setTimeout(function(){if(BIZD.length===0){useFallback();}},8000);
}
function parseBiz(row){
  var c=CFG.BIZ_COLS,lat=parseFloat(row[c.lat]),lng=parseFloat(row[c.lng]);
  if(isNaN(lat)||isNaN(lng))return null;
  return{img:row[c.img]||'',name:(row[c.name]||'').trim(),area:(row[c.area]||'').trim(),
    addr:(row[c.addr]||'').trim(),lat:lat,lng:lng,phone:(row[c.phone]||'').trim(),
    type:(row[c.type]||'').trim(),url:(row[c.url]||'').trim(),services:(row[c.services]||'').trim()};
}
function parseArt(row){
  var c=CFG.ART_COLS,lat=parseFloat(row[c.lat]),lng=parseFloat(row[c.lng]);
  if(isNaN(lat)||isNaN(lng))return null;
  return{img:row[c.img]||'',artist:(row[c.artist]||'').trim(),title:(row[c.title]||'').trim(),
    medium:(row[c.medium]||'').trim(),lat:lat,lng:lng,addr:(row[c.addr]||'').trim(),year:(row[c.year]||'').trim()};
}
function useFallback(){
  BIZD=FB_BIZ; ARTD=FB_ART;
  sbar('',false);
  ss('src-label',BIZD.length+' businesses');
  finish();
}
function finish(){
  filtBiz=BIZD.slice(); filtArt=ARTD.slice();
  ss('biz-count',BIZD.length); ss('art-count',ARTD.length);
  buildDDs(); applyFilters();
}

// =============================================================================
// MAP — initialized AFTER window load so dimensions are settled
// =============================================================================
var AC={'Route One':'#C62828','Route 1 Main':'#D84315','Route 1 Alternate':'#E64A19',
  "The Mall at Prince George's":'#1565C0','The Mall at PG':'#1565C0',
  'University Town Center':'#00695C','PG Metro':'#283593',
  "Prince George's Plaza Transit District":'#283593',
  'Arts District Hyattsville (East)':'#AD1457','Arts District Hyattsville (West)':'#AD1457',
  'West Hyattsville':'#558B2F','West Hyattsville Transit District':'#558B2F',
  'Queens Chapel Town Center':'#F57F17','Queens Chapel':'#F57F17',
  'Historic Hyattsville':'#6D4C41','Hyattsville Historic District':'#6D4C41',
  'Hamilton & 38TH St':'#795548','Metro Shops':'#546E7A','The Shoppes at Metro':'#546E7A',
  'Giant Shopping Center':'#0277BD','40TH Avenue':'#00838F'};
function pc(a){return AC[a]||'#546E7A';}

function initMap(){
  var el=document.getElementById('map');
  map=L.map(el,{zoomControl:true,preferCanvas:false}).setView([38.958,-76.949],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_4etp_1_8910dac608650f6a5c06f08c',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd',maxZoom:19,crossOrigin:true
  }).addTo(map);
  bizLayer=L.markerClusterGroup({iconCreateFunction:function(c){return cIcon(c,'#C62828');},maxClusterRadius:40});
  artLayer=L.markerClusterGroup({iconCreateFunction:function(c){return cIcon(c,'#6A1B9A');},maxClusterRadius:40});
  map.addLayer(bizLayer);
  obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){var img=e.target,src=img.dataset.src;
        if(src){img.src=src;img.onload=function(){img.classList.add('loaded');};img.onerror=function(){img.remove();};obs.unobserve(img);}
      }
    });
  },{root:document.getElementById('tbl-wrap'),rootMargin:'100px'});
  loadData();
}

function cIcon(c,col){return L.divIcon({html:'<div style="background:'+col+';color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+c.getChildCount()+'</div>',className:'',iconSize:[30,30]});}
function pin(color){return L.divIcon({html:'<svg width="22" height="34" viewBox="0 0 22 34" xmlns="http://www.w3.org/2000/svg"><path d="M11 0C4.9 0 0 4.9 0 11c0 8.1 11 22 11 22s11-13.9 11-22C22 4.9 17.1 0 11 0z" fill="'+color+'"/><circle cx="11" cy="11" r="4.5" fill="white"/></svg>',className:'',iconAnchor:[11,34],popupAnchor:[0,-34]});}

// =============================================================================
// DROPDOWNS
// =============================================================================
function buildDDs(){
  fillDD('dd-area',uniq(BIZD.map(function(r){return r.area;})),'area');
  fillDD('dd-type',uniq(BIZD.map(function(r){return r.type;})),'type');
  fillDD('dd-svc',uniq(BIZD.reduce(function(a,r){return a.concat(r.services.split(',').map(function(s){return s.trim();}));},[])),'svc');
  fillDD('dd-medium',uniq(ARTD.map(function(r){return r.medium;})),'medium');
}
function fillDD(id,opts,key){
  var dd=document.getElementById(id),ei=dd.querySelector('input');dd.innerHTML='';if(ei)dd.appendChild(ei);
  var all=mko('All',true);
  all.onclick=function(e){e.stopPropagation();filt[key]='';dd.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});all.classList.add('sel');applyFilters();updBtn(key,'');};
  dd.appendChild(all);
  opts.forEach(function(o){var el=mko(o,false);el.onclick=function(e){e.stopPropagation();filt[key]=o;dd.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});el.classList.add('sel');applyFilters();updBtn(key,o);};dd.appendChild(el);});
}
function mko(t,s){var d=document.createElement('div');d.className='opt'+(s?' sel':'');d.textContent=t;return d;}
function updBtn(key,val){
  var lb={name:'Business Name',area:'Area',type:'Business Type',svc:'Service Options',artist:'Artist',medium:'Medium'};
  var btn=document.getElementById('fb-'+key);if(!btn)return;
  btn.childNodes[0].textContent=(val||lb[key])+' ';
  btn.classList.toggle('on',!!val);
}
function toggleDD(key,e){
  e.stopPropagation();
  ['name','area','type','svc','artist','medium'].forEach(function(k){
    var d=document.getElementById('dd-'+k);if(d)d.classList.toggle('open',k===key&&!d.classList.contains('open'));
  });
}
document.addEventListener('click',function(){document.querySelectorAll('.dd').forEach(function(d){d.classList.remove('open');});});

// =============================================================================
// FILTERS
// =============================================================================
function applyFilters(){
  hlRow=-1;
  if(curTab==='biz'){
    var nq=(document.getElementById('name-inp')||{}).value||'';
    filtBiz=BIZD.filter(function(r){
      return(!nq||r.name.toLowerCase().indexOf(nq.toLowerCase())>-1)&&
             (!filt.area||r.area===filt.area)&&
             (!filt.type||r.type===filt.type)&&
             (!filt.svc||r.services.indexOf(filt.svc)>-1);
    });
    renderBizMarkers();renderBizTable();
  }else{
    var aq=(document.getElementById('artist-inp')||{}).value||'';
    filtArt=ARTD.filter(function(r){
      return(!aq||r.artist.toLowerCase().indexOf(aq.toLowerCase())>-1)&&
             (!filt.medium||r.medium===filt.medium);
    });
    renderArtMarkers();renderArtTable();
  }
}
function clearFilters(){
  filt={name:'',area:'',type:'',svc:'',artist:'',medium:''};
  ['name-inp','artist-inp'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  document.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  document.querySelectorAll('.f-wrap .opt:first-child').forEach(function(o){o.classList.add('sel');});
  ['name','area','type','svc','artist','medium'].forEach(function(k){updBtn(k,'');});
  applyFilters();
}

// =============================================================================
// RENDER
// =============================================================================
function renderBizMarkers(){
  bizLayer.clearLayers();bizMarkers=[];
  filtBiz.forEach(function(r,i){
    var m=L.marker([r.lat,r.lng],{icon:pin(pc(r.area))});
    var ih=r.img?'<img src="'+r.img+'" class="pop-img" onerror="this.remove()">':'';
    var d=dom(r.url);
    m.bindPopup('<div style="min-width:170px">'+ih+'<b style="font-size:12px;display:block;margin-bottom:2px">'+r.name+'</b>'+'<span style="font-size:10px;color:#666">'+r.type+(r.area?' · '+r.area:'')+'</span>'+'<br><span style="font-size:10px;color:#888">'+r.addr+'</span>'+(r.phone?'<br><span style="font-size:10px">'+r.phone+'</span>':'')+(d?'<br><a href="'+r.url+'" target="_blank" style="font-size:10px;color:#2563a8">'+d+'</a>':'')+'</div>',{maxWidth:220});
    m.on('click',function(){hlBiz(i);});
    bizLayer.addLayer(m);bizMarkers.push(m);
  });
}
function renderBizTable(){
  // Fixed layout with defined column widths for the wider biz table
  var t=document.getElementById('main-table');
  var cg=document.getElementById('main-colgroup');
  t.style.tableLayout='fixed';
  cg.innerHTML='<col style="width:58px"><col style="width:160px"><col style="width:120px"><col style="width:140px"><col style="width:110px"><col style="width:100px"><col style="width:120px"><col>';
  ss('rcount',filtBiz.length+' / '+BIZD.length+' businesses');
  ss('biz-count',filtBiz.length);
  document.getElementById('thead').innerHTML='<tr><th>Image</th><th>Business Name</th><th>Area</th><th>Address</th><th>Contact</th><th>Type</th><th>Website</th><th>Services</th></tr>';
  var tbody=document.getElementById('tbody');tbody.innerHTML='';
  filtBiz.forEach(function(r,i){
    var tr=document.createElement('tr');if(i===hlRow)tr.classList.add('hl');
    // fixed-size image cell — no layout shift
    var tc=document.createElement('td');tc.className='ic';
    var bx=document.createElement('div');bx.className='ib';
    var ph=document.createElement('div');ph.className='ph';ph.textContent=r.type;bx.appendChild(ph);
    if(r.img){var img=document.createElement('img');img.dataset.src=r.img;img.alt=r.type;bx.appendChild(img);setTimeout(function(){if(obs)obs.observe(img);},0);}
    tc.appendChild(bx);tr.appendChild(tc);
    var d=dom(r.url);
    tr.insertAdjacentHTML('beforeend',
      '<td style="font-weight:500">'+r.name+'</td>'+
      '<td style="color:#555">'+( r.area||'—')+'</td>'+
      '<td>'+r.addr+'</td>'+
      '<td>'+r.phone+'</td>'+
      '<td><span class="badge bb">'+r.type+'</span></td>'+
      '<td>'+(d?'<a href="'+r.url+'" target="_blank" onclick="event.stopPropagation()">'+d+'</a>':'')+'</td>'+
      '<td class="wrap" style="color:#555">'+r.services+'</td>');
    tr.addEventListener('click',function(){hlBiz(i);map.setView([r.lat,r.lng],16,{animate:true});if(bizMarkers[i])bizMarkers[i].openPopup();});
    tbody.appendChild(tr);
  });
}
function hlBiz(i){hlRow=i;document.querySelectorAll('#tbody tr').forEach(function(tr,idx){tr.classList.toggle('hl',idx===i);});var rows=document.querySelectorAll('#tbody tr');if(rows[i])rows[i].scrollIntoView({behavior:'smooth',block:'nearest'});}

function renderArtMarkers(){
  artLayer.clearLayers();artMarkers=[];
  filtArt.forEach(function(r,i){
    var m=L.marker([r.lat,r.lng],{icon:pin('#6A1B9A')});
    m.bindPopup('<div style="min-width:170px"><b style="font-size:12px;display:block;margin-bottom:2px">'+r.title+'</b><span style="font-size:10px;color:#666">'+r.medium+' · '+r.artist+'</span>'+(r.year?'<br><span style="font-size:10px;color:#888">Year: '+r.year+'</span>':'')+'<br><span style="font-size:10px;color:#888">'+r.addr+'</span></div>',{maxWidth:220});
    m.on('click',function(){hlArt(i);});
    artLayer.addLayer(m);artMarkers.push(m);
  });
}
function renderArtTable(){
  // Auto layout — columns size to their content, artist name gets full room
  var t=document.getElementById('main-table');
  var cg=document.getElementById('main-colgroup');
  t.style.tableLayout='auto';
  cg.innerHTML='';
  ss('rcount',filtArt.length+' / '+ARTD.length+' artworks');
  ss('art-count',filtArt.length);
  document.getElementById('thead').innerHTML='<tr><th>Artist</th><th>Title</th><th>Medium</th><th>Year</th><th>Address</th></tr>';
  var tbody=document.getElementById('tbody');tbody.innerHTML='';
  filtArt.forEach(function(r,i){
    var tr=document.createElement('tr');if(i===hlRow)tr.classList.add('hl');
    tr.innerHTML='<td style="font-weight:500">'+r.artist+'</td><td>'+r.title+'</td><td><span class="badge ba">'+r.medium+'</span></td><td style="white-space:nowrap">'+(r.year||'—')+'</td><td style="color:#555">'+r.addr+'</td>';
    tr.addEventListener('click',function(){hlArt(i);map.setView([r.lat,r.lng],16,{animate:true});if(artMarkers[i])artMarkers[i].openPopup();});
    tbody.appendChild(tr);
  });
}
function hlArt(i){hlRow=i;document.querySelectorAll('#tbody tr').forEach(function(tr,idx){tr.classList.toggle('hl',idx===i);});var rows=document.querySelectorAll('#tbody tr');if(rows[i])rows[i].scrollIntoView({behavior:'smooth',block:'nearest'});}

function switchTab(tab){
  curTab=tab;hlRow=-1;
  document.getElementById('tab-biz').classList.toggle('active',tab==='biz');
  document.getElementById('tab-art').classList.toggle('active',tab==='art');
  document.getElementById('biz-filters').style.display=tab==='biz'?'flex':'none';
  document.getElementById('art-filters').style.display=tab==='art'?'flex':'none';
  if(tab==='biz'){map.removeLayer(artLayer);map.addLayer(bizLayer);}
  else{map.removeLayer(bizLayer);map.addLayer(artLayer);}
  applyFilters();
}

// Init after full page load so map div has real dimensions
window.addEventListener('load',function(){
  initMap();
  // Support ?tab=art or #art in the URL to default to the art tab
  var hash = window.location.hash.replace('#','');
  var param = new URLSearchParams(window.location.search).get('tab');
  if(hash === 'art' || param === 'art'){ switchTab('art'); }
});
</script>
